<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>Forms</h1>
    <hr>

<form>
    <h2>Student Registration Form</h2>
    <label>Full Name</label><br>
    <input type="text"><br><br>
    <label>Email</label><br>
    <input type="email"><br><br>
    <label>Password</label><br>
    <input type="password"><br><br>
    <label>Date of Birth</label><br>
    <input type="date"><br><br>
    <label>Class</label><br>
    <select>
        <option>X ICT</option>
        <option>X CCP</option>
        <option>X TCP</option>
        <option>XI ICT</option>
        <option>XI CCP</option>
        <option>XI TCP</option>
        <option>XII ICT</option>
        <option>XII CCP</option>
        <option>XII TCP</option>
    </select>
    <br><br>
    <label>Gender</label><br>
    <input type="radio" name="gender">Male
    <input type="radio" name="gender">Female
    <br><br>
    <label>Skills</label><br>
    <input type="checkbox">HTML
    <input type="checkbox">CSS
    <input type="checkbox">JavaScript
    <input type="checkbox">Python
    <input type="checkbox">Tahfidz<br>
    <input type="checkbox">English Cambridge
    <input type="checkbox">Matematika Cambridge
    <input type="checkbox">Biologo Cambridge
    <br><br>
    <label>About Yourself</label><br>
    <textarea rows="6" cols="40"></textarea>
    <br><br>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
</form>

<br>
    <button onclick="location.href='page3.html'">halaman ke tiga</button>
</body>
</html>
